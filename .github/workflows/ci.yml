name: CI

on:
  push:
    branches:
      - dev
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slidev-smoke:
    name: Slidev Smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '24'
    env:
      CI: true
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build English example deck
        run: pnpm exec slidev build examples/example.md --out "${RUNNER_TEMP}/slidev-example-en" --without-notes

      - name: Build Academic 16:9 example deck
        run: pnpm exec slidev build examples/example-academic.md --out "${RUNNER_TEMP}/slidev-example-academic" --without-notes

      - name: Build Chinese example deck
        run: pnpm exec slidev build examples/example-zh.md --out "${RUNNER_TEMP}/slidev-example-zh" --without-notes

  quality:
    name: Full Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vscode-extension/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: pnpm install --frozen-lockfile

      - name: Run full quality gate
        run: pnpm run check
